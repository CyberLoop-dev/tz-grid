<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img"><title>TZ Grid</title><desc>Convert a meeting time across several time zones.</desc><rect width="920" height="300" rx="28" fill="#0b1220"/><rect x="34" y="34" width="852" height="232" rx="22" fill="#111827" stroke="#38bdf8" stroke-width="2"/><g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="210" cy="150" r="68"/><path d="M210 106v46l32 20M210 82v-18M142 150h-18M278 150h18"/><path d="M330 150h100m-14-14 14 14-14 14"/><circle cx="520" cy="150" r="45"/><circle cx="700" cy="150" r="45"/><path d="M565 150h90m-14-14 14 14-14 14"/></g><text x="520" y="157" fill="#e5edf7" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">UTC</text><text x="700" y="157" fill="#e5edf7" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Local</text><text x="460" y="246" fill="#e5edf7" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">One meeting • many local times</text></svg>